name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    # Opt-in: create the repository variable ENABLE_PYPI_PUBLISH=true under
    # Settings -> Secrets and variables -> Actions -> Variables. Until then
    # this job is skipped and no PyPI credentials are needed.
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hyprcam
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no API token required.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

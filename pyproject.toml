[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprcam"
version = "0.1.0"
description = "Minimal frameless webcam window designed to tile in Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mhdztr", email = "zakkithoriq@gmail.com" }]
keywords = ["hyprland", "webcam", "v4l2", "obs", "qt"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
hyprcam = "hyprcam.__main__:main"
hyprcam-toggle = "hyprcam.toggle:main"

[project.urls]
Homepage = "https://github.com/mhdztr/hyprcam"
Repository = "https://github.com/mhdztr/hyprcam"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

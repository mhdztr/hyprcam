[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprcam"
version = "0.1.0"
description = "Frameless, tiled webcam window for Hyprland with live settings and OBS-friendly screen capture"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mhdztr", email = "zakkithoriq@gmail.com" }]
keywords = [
    "hyprland",
    "wayland",
    "webcam",
    "v4l2",
    "obs",
    "qt",
    "pyside6",
    "opencv",
    "screen-capture",
    "arch-linux",
    "tiling-window-manager",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
hyprcam = "hyprcam.__main__:main"
hyprcam-toggle = "hyprcam.toggle:main"

[project.urls]
Homepage = "https://github.com/mhdztr/hyprcam"
Source = "https://github.com/mhdztr/hyprcam"
Repository = "https://github.com/mhdztr/hyprcam"
Issues = "https://github.com/mhdztr/hyprcam/issues"
Documentation = "https://github.com/mhdztr/hyprcam#readme"
Changelog = "https://github.com/mhdztr/hyprcam/blob/main/CHANGELOG.md"
Releases = "https://github.com/mhdztr/hyprcam/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
